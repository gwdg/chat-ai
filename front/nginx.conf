# Used by Dockerfile.prod. The container port is fixed; docker-compose.prod.yml maps it to the host.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # Both JS types: nginx's mime.types still uses application/javascript, RFC 9239 says text/javascript
    gzip_types text/css text/plain application/javascript text/javascript application/json image/svg+xml;

    # Vite fingerprints every file in /assets/, so these never change under the same name.
    # A missing asset is a 404, not index.html: serving HTML as JS hides the real error.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # Client-side routes (/chat/<id>, ...) fall back to the SPA shell. Revalidate on every
    # load so a new deployment is picked up immediately.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri $uri/ /index.html;
    }
}
